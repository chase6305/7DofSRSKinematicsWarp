name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: srs-warp-lab --validate-only --backend numpy
      - run: srs-warp-lab --validate-only --backend warp --device cpu
      - run: srs-warp-lab --demo trajectory --backend numpy --plane tool-xy --path-size 0.015 --frames 12 --export-csv /tmp/srs-trajectory-numpy.csv
      - run: srs-warp-lab --demo trajectory --backend warp --device cpu --plane tool-xy --path-size 0.015 --frames 12 --export-csv /tmp/srs-trajectory-warp.csv
      - run: python -m example.parallel_demo --device cpu --backend warp --batch-size 16 --num-samples 32 --repeats 2
      - run: python -m compileall -q srs_solver.py warp_kernel.py srs_warp_viser example
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python tools/check_wheel.py dist/*.whl
      - name: Validate the installed wheel outside the checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$(mktemp -d)"
          srs-warp-lab --validate-only --backend numpy
          srs-warp-lab --validate-only --backend warp --device cpu
          srs-warp-lab --demo trajectory --backend warp --device cpu --plane tool-xy --path-size 0.015 --frames 12 --export-csv trajectory.csv
