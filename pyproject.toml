[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "srs-kinematics-warp"
version = "0.1.0"
description = "Analytical FK/IK solver for SRS 7-DOF manipulators with Warp acceleration"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SRS Kinematics Contributors" }]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "warp-lang>=1.5",
    "coloredlogs>=15.0",
]

[project.optional-dependencies]
viewer = [
    "viser==1.0.24",
    "yourdfpy>=0.0.60",
    "trimesh>=4.0",
]
dev = [
    "pytest>=8.0",
    "ipython>=8.0",
]

[project.scripts]
srs-viewer = "viser_viewer:main"
srs-demo = "example.demo:main"
srs-parallel-demo = "example.parallel_demo:main"
srs-null-space-demo = "example.parallel_null_space_demo:main"
srs-warp-lab = "srs_warp_viser.app:main"

[tool.setuptools]
py-modules = ["srs_solver", "warp_kernel", "viser_viewer"]
packages = ["example", "srs_kinematics_warp_assets", "srs_warp_viser"]

[tool.setuptools.package-dir]
srs_kinematics_warp_assets = "urdf"

[tool.setuptools.package-data]
srs_kinematics_warp_assets = ["*.urdf", "README.md", "ASSET_LICENSE", "visual/*.glb", "collision/*.stl", "meshes/*.dae", "meshes/*.stl"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
